# What `./kit check` and `./kit done` do differently on a whole run (see ps2kit/cargo_gate.py). Tracked, so
# every worktree's gate agrees; kit.toml stays per machine.

# Binaries the gate runs only when the work touches what they prove. `./kit check --all` (the run's merge
# check) always runs them, and `./kit check -- -p game-sim --test camera` runs one by name.
[[slow]]
# 22 oracle proofs of the camera, each over a minute: 268 s, the gate's longest binary (2026-10-23).
test = "-p game-sim --test camera"
paths = ["crates/game-sim/src/camera.rs", "crates/game-sim/src/air.rs", "crates/game-sim/tests/camera.rs",
         "crates/ps2-float/*", "crates/ps2-oracle/*", "research/oracle.txt"]

[[slow]]
# The fixed update against the original's frame, 12,000 frames and 10,000 clock samples: 148 s.
test = "-p game-sim --test tick"
paths = ["crates/game-sim/src/tick.rs", "crates/game-sim/src/rng.rs", "crates/game-sim/src/input.rs",
         "crates/game-sim/tests/tick.rs", "crates/ps2-float/*", "crates/ps2-oracle/*", "research/oracle.txt"]

[flaky]
# Wall-clock and loopback-port tests that red under the other slots' load and pass alone (memory of 10-21
# to 10-23: lobby's mDNS seating, udp's dropped-and-rebound ports, pace's frame timing). Each is a regex on
# `<rerun args>::<test>`; one rerun each, holding every check slot on the machine so no other gate loads it
# (10-29: a rerun beside them failed fixed_rate again at load 70-100), and only when nothing else in that
# binary failed.
tests = [
    "--test lobby::",
    "::(.*::)?two_builds_since_the_id_both_say_why$",
    "::(.*::)?a_60_fps_limit_sleeps_the_frame_and_leaves_the_ticks_alone$",
    # binds 127.0.0.1:47613/47614 outright, so another slot running it at the same moment takes the port (S122, 10-27)
    "::(.*::)?two_online_machines_start_their_seats_in_the_plane_on_a_race_track$",
    # rides for so many seconds of wall clock and counts the ticks: at load 30+ a frame overruns and they part (S122, 10-27)
    "--test fixed_rate::",
    # a desktop peer and headless chromium over a loopback relay: chromium starts slowly under load (P213, 10-29)
    "--test netplay_browser::",
]

[alone]
# Binaries that hold themselves to a time budget: run one by one after the pool. A failure reruns once
# holding every check slot on the machine, so no other worktree's gate is loading it either, and only that
# rerun counts (K6: alone in its own gate was not enough with three gates at once — P179 parked red on
# one_fps at load 31, 10-27; holding the machine for every run would stall every gate). one_fps and ecosystem's densest view both
# red in the first parallel merge gate (P128, 10-23 16:16) and are the original's frame-budget and the smooth
# rule's no-slower checks.
tests = ["-p openmx --test one_fps", "-p game-render --test ecosystem"]

[display]
# Every window a check's tests open goes to a private headless weston + Xwayland that ends with the check
# (ps2kit/platform_.py PrivateDisplay), not to the desktop's compositor: Hyprland 0.56.2 held 105 GiB of GPU
# memory after ten days of runs and the kernel OOM-killed the runner (K16, 2026-10-30). Without weston the
# windows go to the caller's display, and the check says so under its verdict. `grew_mib`: the check also notes
# when the desktop compositor's GTT grew more than this over the run.
private = true
size = "1920x1080"
grew_mib = 1024
