# What `./kit check` and `./kit done` do differently on a whole run (see ps2kit/cargo_gate.py). Tracked, so
# every worktree's gate agrees; kit.toml stays per machine.

# Binaries the gate runs only when the work touches what they prove. `./kit check --all` (the run's merge
# check) always runs them, and `./kit check -- -p game-sim --test camera` runs one by name.
[[slow]]
# 22 oracle proofs of the camera, each over a minute: 268 s, the gate's longest binary (2026-10-23).
test = "-p game-sim --test camera"
paths = ["crates/game-sim/src/camera.rs", "crates/game-sim/src/air.rs", "crates/game-sim/tests/camera.rs",
         "crates/ps2-float/*", "crates/ps2-oracle/*", "research/oracle.txt"]

[[slow]]
# The fixed update against the original's frame, 12,000 frames and 10,000 clock samples: 148 s.
test = "-p game-sim --test tick"
paths = ["crates/game-sim/src/tick.rs", "crates/game-sim/src/rng.rs", "crates/game-sim/src/input.rs",
         "crates/game-sim/tests/tick.rs", "crates/ps2-float/*", "crates/ps2-oracle/*", "research/oracle.txt"]

[flaky]
# Wall-clock and loopback-port tests that red under the other slots' load and pass alone (memory of 10-21
# to 10-23: lobby's mDNS seating, udp's dropped-and-rebound ports, pace's frame timing). Each is a regex on
# `<rerun args>::<test>`; one lone rerun each, and only when nothing else in that binary failed.
tests = [
    "--test lobby::",
    "::(.*::)?two_builds_since_the_id_both_say_why$",
    "::(.*::)?a_60_fps_limit_sleeps_the_frame_and_leaves_the_ticks_alone$",
]

[alone]
# Binaries that hold themselves to a time budget: run one by one after the pool, holding every check slot on
# the machine, so neither the gate's own other binaries nor another worktree's gate is loading it (K6: alone
# in its own gate was not enough with three gates at once — P179 parked red on one_fps, 10-27). A filtered
# check naming one of them (the run's retest) takes the machine too. one_fps and ecosystem's densest view both
# red in the first parallel merge gate (P128, 10-23 16:16) and are the original's frame-budget and the smooth
# rule's no-slower checks.
tests = ["-p openmx --test one_fps", "-p game-render --test ecosystem"]
