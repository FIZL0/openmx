# s252a-downed.toml — a downed bike on free06 in a HasPhysics truck's way, one row a tick (S252a).
#
# research/s252a/drop.py wrecks s89-along's bike (the 250) on the line of the truck at 0x01cc7630 (S207's
# ctruck, research/oracle.txt S186) a few seconds before the truck comes; research/s252a/strike.py records
# this from its state and saves states around the truck's wake:
#
#   KIT_PCSX2=3 ./kit pcsx2 with -- python3 -B research/s252a/strike.py NAME SLOT
#
# Addresses as every state made from s89-along has them: the rider 0x01890cd0 (+0x748 the wreck reason),
# the wreck bike's body 0x0196f020 (the rider's +0x7a8 -> +0x110: +0x00 enabled, +0x60 position, +0x70 velocity, +0x170 quat, +0x1b0
# rates; 0x01971110 is the riding body, frozen at the wreck's velocity with the wreck's position), the ragdoll's body actor 0x009ffc50 (the vehicle 0x00a00050
# - 0x400): its eighteen parts (+0x2f4, stride 0xb0, the bone's body at +0xa4) and its nine bone collisions
# (+0x624, +0x14 touched). The truck: its physical flag (+0x588, the struck listener's wake sets it), +0x58c,
# its path clock (+0x430 -> +0xc), its position (+0x470) and heading (+0x480).

[watch]
name        = "s252a-downed"
description = "a downed free06 bike and its ragdoll in a HasPhysics truck's way, a row a tick"
every       = 1
frames      = 600

[setup]
warmup    = 0
settle_ms = 240

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "dt"
addr = "@frame_dt"
type = "f32"

[[field]]
name = "reason"
addr = "0x1890cd0 + 0x748"
type = "u32"

[[field]]
name = "wreck_on"
addr = "0x196f020"
type = "u32"

[[field]]
name = "wreck_pos"
addr = "0x196f020 + 0x60"
type = "f32x4"

[[field]]
name = "wreck_vel"
addr = "0x196f020 + 0x70"
type = "f32x4"

[[field]]
name = "wreck_quat"
addr = "0x196f020 + 0x170"
type = "f32x4"

[[field]]
