# c19-kiowa-strike.toml — C17's rotor strike (C19): c14-kiowa.toml's rows, plus the rotor probe's ray record,
# played from a generated tape with no pad, one row a tick: the pad as the game read it, the flight
# controller's inputs, outputs and loop state, the rotor and aero models' states, and the body.
#
#   ./kit record --dry-run watch/c19-kiowa-strike.toml
#   ./kit pcsx2 with -- research/c19/capture.sh PID context/recordings/c17/strike.p2m2 300 OUT.csv
#
# The state (research/c14's journal entry: S148's boot.py, the cheat flag, the pause menu's Switch To
# Machine played from a tape) has MXHelicopter as the first entry of the manager's actor list, owned by
# the local human's player record (src 1), its body at +0x160. If `heli_class` is not 0x0045c980 or
# `heli_ctl_src` is not 1, the list moved.
#
# Offsets: research/oracle.txt, the S148 and S220 blocks. Two raw blocks carry the controller's whole
# field run so a replay can read any word: +0x330..+0x3e0 (pad +0x334..+0x348, outputs +0x34c..+0x35c,
# +0x33c height/MaxAltitude, last stick +0x360, flown +0x364, file +0x368..+0x3d0 with the hold delay
# +0x380, hold height/timer +0x378/+0x37c, integral +0x394, speed command +0x3b0, wreck word +0x3d4),
# and +0x460..+0x4d0 (the collective filter +0x46c, the measure's speed/alpha/beta +0x470..+0x478,
# airspeed +0x498, pitch +0x4c0, roll +0x4c8).

[watch]
name        = "c19-kiowa-strike"
description = "the Kiowa on free09 as c14-kiowa, plus the rotor probe's ray record, the collision record's contacts and the thrown blades"
every       = 1
frames      = 900

[setup]
warmup = 0               # research/c14/capture.sh loads the state through PCSX2's Play, not the kit

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "dt"
addr = "@frame_dt"
type = "f32"

[[field]]
name = "rng_state"
addr = "@rand_state"
type = "u64"

[[array]]
name   = "ctl"
addr   = "@pad0_control_state"
count  = 16
stride = 0x18

[[array.field]]
name = "held"
off  = 0
type = "u32"

# Both halves of port 0's buffer and their stamps (biplane.toml has why): bytes [2..3] the buttons,
# active low, [4..7] RX RY LX LY, [8..] the pressures.
[[field]]
name = "pad_a"
addr = "@pad_buffers"
type = "bytes:20"

[[field]]
name = "stamp_a"
addr = "@pad0_stamp_a"
type = "u32"

[[field]]
name = "pad_b"
addr = "@pad_buffers + 0x80"
type = "bytes:20"

[[field]]
name = "stamp_b"
addr = "@pad0_stamp_b"
type = "u32"

# --- which actor this is ------------------------------------------------------------------------------
[[field]]
name = "heli_type"             # +0x00: 1, a machine
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x0"
type = "u32"
required = true

[[field]]
name = "heli_class"            # +0x48: MXHelicopter's vtable, 0x0045c980
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x48"
type = "u32"

[[field]]
name = "heli_ctl_src"          # +0x20 -> +0x34: 1 = the local human
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x20 -> 0x34"
type = "u32"
required = true

[[field]]
name = "pilot_flag"            # *(+0x170)+0x40: with climb 0, zeroes the collective
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x170 -> 0x40"
type = "u32"

# --- the flight controller --------------------------------------------------------------------------
[[field]]
name = "climb"                 # +0x334, the pad's climb (Cross)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x334"
type = "f32"

[[field]]
name = "descend"               # +0x338 (Square)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x338"
type = "f32"

[[field]]
name = "stick"                 # +0x340 lateral, +0x344 longitudinal, +0x348 pedal (+0x34c collective)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x340"
type = "f32x4"

[[field]]
name = "commands"              # +0x34c collective, +0x350 lat cyclic, +0x354 long cyclic, +0x358 pedal
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x34c"
type = "f32x4"

[[field]]
name = "heli_a"                # +0x330..+0x3e0, raw
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x330"
type = "bytes:176"

[[field]]
name = "heli_b"                # +0x460..+0x4d0, raw
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x460"
type = "bytes:112"

# --- the rotor (+0x450) and aero (+0x454) models' states ----------------------------------------------
[[field]]
name = "rotor_state"           # +0xd0 collective pitch .. +0x120: tilt Euler +0xe0, thrust +0x100, tilted +0x110
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x450 -> 0xd0"
type = "bytes:80"

[[field]]
name = "aero_state"            # +0x128 fade, +0x12c lift, drag, side, roll, pitch, +0x140 yaw
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x454 -> 0x128"
type = "bytes:28"

# --- the body (+0x160) ----------------------------------------------------------------------------------
[[field]]
name = "body_pos"              # body +0x60: the centre of gravity, world
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x160 -> 0x60"
type = "f32x4"

[[field]]
name = "body_vel"              # body +0x70: world velocity
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x160 -> 0x70"
type = "f32x4"

[[field]]
name = "body_quat"             # body +0x170: orientation, x y z w
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x160 -> 0x170"
type = "f32x4"

[[field]]
name = "body_rate"             # body +0x1b0: angular velocity
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x160 -> 0x1b0"
type = "f32x4"

[[field]]
name = "body_raw"              # body +0x0..+0x200, raw: the accumulators and the rest a replay may need
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x160 -> 0x0"
type = "bytes:512"

# --- C19: the rotor probe (+0x458) and its ray record (probe +0x6c; research/oracle.txt S46, C17) ---------
# The crash test searches it while the wreck word is 0 and reads objects[0] when the probe's +0x116 bit 5
# is up; the record keeps its last search's hits after that.
[[field]]
name = "rotor_flags"           # probe +0x114: the byte +0x116 is bits 16..23 (bit 5 of it: struck)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x458 -> 0x114"
type = "u32"

[[field]]
name = "rotor_count"           # record +0x8c: the hits
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x458 -> 0x6c -> 0x8c"
type = "u32"

[[field]]
name = "rotor_objects"         # record +0x9c -> the struck objects, one a hit (8 rays)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x458 -> 0x6c -> 0x9c -> 0x0"
type = "bytes:32"

[[field]]
name = "rotor_points"          # record +0x98 -> the hit points, world
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x458 -> 0x6c -> 0x98 -> 0x0"
type = "bytes:128"

[[field]]
name = "rotor_segments"        # record +0xac -> each hit's segment word (leaf bit included)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x458 -> 0x6c -> 0xac -> 0x0"
type = "bytes:32"

[[field]]
name = "struck_category"       # objects[0] +0x84: a trunk's is 4
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x458 -> 0x6c -> 0x9c -> 0x0 -> 0x84"
type = "u32"

[[field]]
name = "struck_at"             # objects[0] +0x1d0: where a species' trunk was last moved (its plant)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x458 -> 0x6c -> 0x9c -> 0x0 -> 0x1d0"
type = "f32x4"

# --- the helicopter's collision object (+0x170): flags +0x40..+0x4c, contacts +0x100 (count, capacity,
# array), the first four contacts (0x80 each; +0x74 the other object, +0x78 the mover) -----------------
# C21: +0x170 (and a blade wrapper's +0x120) is the collision object, but C19's capture read +0x108 as
# the count and +0x100 as the array: the count is +0x100, the array's pointer +0x108 (fixed below; the
# C19 columns are as captured, so the wrong way round). The touch flags read 0 on every C19 row through
# the fall, where the push frame's save state has them set: do not take the flags' columns as the frame's.
[[field]]
name = "heli_touch"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x170 -> 0x40"
type = "bytes:16"

[[field]]
name = "heli_contacts_n"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x170 -> 0x100"
type = "u32"

[[field]]
name = "heli_contacts"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0x170 -> 0x108 -> 0x0"
type = "bytes:512"

# --- thrown blade 0 (wrapper heli +0xe48; body +0x110, collision object +0x120) ---------------------------
[[field]]
name = "blade0_body"        # body +0x0..+0x200, raw
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe48 -> 0x110 -> 0x0"
type = "bytes:512"

[[field]]
name = "blade0_touch"       # collision object +0x40..+0x4c
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe48 -> 0x120 -> 0x40"
type = "bytes:16"

[[field]]
name = "blade0_contacts_n"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe48 -> 0x120 -> 0x100"
type = "u32"

[[field]]
name = "blade0_contacts"    # the first four contacts
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe48 -> 0x120 -> 0x108 -> 0x0"
type = "bytes:512"

# --- thrown blade 1 (wrapper heli +0xe4c; body +0x110, collision object +0x120) ---------------------------
[[field]]
name = "blade1_body"        # body +0x0..+0x200, raw
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe4c -> 0x110 -> 0x0"
type = "bytes:512"

[[field]]
name = "blade1_touch"       # collision object +0x40..+0x4c
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe4c -> 0x120 -> 0x40"
type = "bytes:16"

[[field]]
name = "blade1_contacts_n"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe4c -> 0x120 -> 0x100"
type = "u32"

[[field]]
name = "blade1_contacts"    # the first four contacts
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe4c -> 0x120 -> 0x108 -> 0x0"
type = "bytes:512"

# --- thrown blade 2 (wrapper heli +0xe50; body +0x110, collision object +0x120) ---------------------------
[[field]]
name = "blade2_body"        # body +0x0..+0x200, raw
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe50 -> 0x110 -> 0x0"
type = "bytes:512"

[[field]]
name = "blade2_touch"       # collision object +0x40..+0x4c
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe50 -> 0x120 -> 0x40"
type = "bytes:16"

[[field]]
name = "blade2_contacts_n"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe50 -> 0x120 -> 0x100"
type = "u32"

[[field]]
name = "blade2_contacts"    # the first four contacts
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe50 -> 0x120 -> 0x108 -> 0x0"
type = "bytes:512"

# --- thrown blade 3 (wrapper heli +0xe54; body +0x110, collision object +0x120) ---------------------------
[[field]]
name = "blade3_body"        # body +0x0..+0x200, raw
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe54 -> 0x110 -> 0x0"
type = "bytes:512"

[[field]]
name = "blade3_touch"       # collision object +0x40..+0x4c
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe54 -> 0x120 -> 0x40"
type = "bytes:16"

[[field]]
name = "blade3_contacts_n"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe54 -> 0x120 -> 0x100"
type = "u32"

[[field]]
name = "blade3_contacts"    # the first four contacts
addr = "@game_manager -> 0x34 -> 0x34 -> 0x0 -> 0xe54 -> 0x120 -> 0x108 -> 0x0"
type = "bytes:512"
