# acceptance.toml — the acceptance run: a sequence of real play, recorded so the port can be replayed
# against it frame by frame. This is the spec S8's test reads; `crates/game-sim/tests/replay.rs` turns
# a capture of it into a fixture (inputs from the control columns, watches from the bike columns).
#
#   ./kit record --dry-run watch/acceptance.toml                      # check the spec, no emulator
#   cp context/recordings/first_recording.p2m2_SaveState.p2s \
#      "<copy>/PCSX2/savestates/SLUS-20767 (9866FE54).08.p2s"         # the recording's own start state
#   ./kit record watch/acceptance.toml --state 8 -n 1811 \
#       -o context/capture/acceptance-freeride.csv                    # the recording's own 60 s, at 30 Hz
#
# That one is the original idling: the input the state was saved mid-ride with is a *recording*, and
# PCSX2 only plays a `.p2m2` back from its GUI, which an agent cannot reach (plan/HUMAN.md has the ask).
# For a capture with input and motion in it, ride the same state with the kit's own pad — one job, the
# recorder in the background and the pad script in front of it:
#
#   ./kit pcsx2 with -- bash -c '
#       ./kit record watch/acceptance.toml --state 8 -n 900 \
#           -o context/capture/acceptance-ride.csv & rec=$!
#       sleep 6                                                       # the state load and the warmup
#       ./kit pad script moves.txt                                    # down cross, stick l, press l1 …
#       wait $rec'
#
# Nothing about the capture depends on the pad being frame-exact (it is wall-clock): every row carries
# the bytes the game actually read that tick, which is what the port replays.
#
# A human recording played back on the original (C6; the GUI's Play is reached over AT-SPI, on a copy):
#
#   ./kit pcsx2 with -- bash research/journal/2026-10-20-c6-c6-recording2-capture/playback/play_capture.sh \
#       PID context/recordings/recording2.p2m2 2374 1894 \
#       context/capture/acceptance/recording2-freeride.csv            # the whole tape, ticks 2374..4267
#
# A row has to carry **both halves of a frame** or it cannot be replayed:
#
#   the input  the sixteen controls the game itself believes are held this frame, plus the raw libpad
#              buffer they were derived from. A fixture needs one input per frame, so this spec is
#              `every = 1` and must stay that way: a capture with a gap in it is not an acceptance
#              recording, and the test refuses one.
#   the state  the player's vehicle actor — velocity and the 4x4 world transform whose row 3 is the
#              position. These are the columns the port is judged on.
#
# Three things to check in the capture before trusting it, all of which the test also checks:
#
#   1. `bike_type` reads 4 (a vehicle) *and* `bike_ctl_src` reads 1 (a local human, not an AI) in every
#      row. Both are needed: a freeride area holds one vehicle per rider and the AI ones are type 4
#      with a non-null player too. The hop count below is the eighth list entry, measured on the
#      acceptance recording's own save state; another mode or another area moves it, so if `bike_type`
#      is not 4 or `bike_ctl_src` is not 1, change the number of `-> 0x8` hops until both read right.
#   2. No empty cells in the bike columns. An empty cell is a pointer chain that went null — no level
#      loaded, or the actor was freed — and a fixture cannot be built across one.
#   3. `dt` is the 30 fps clamp (0.033330001) throughout — that is the value the engine's own clamp
#      produces (I4), not 1/30 = 0.033333335. A frame with any other `dt` is a frame the original
#      integrated differently from the port, and the replay will diverge there for no reason.
#
# The `@symbols` come from C5 (the pad) and R6 (the actors); `./kit sym` lists what this worktree has.
# If a name is missing, paste the block at the end of C5's journal entry into `kit.toml`.

[watch]
name        = "acceptance"
description = "one frame of real play: every control the game read, and the bike it moved"
every       = 1          # one row per frame, always: the fixture needs every frame's input
frames      = 1811       # the acceptance recording is 3621 fields = 1811 ticks; --frames overrides

[setup]
state  = 8               # the acceptance recording's own save state, copied into the scratch slot
warmup = 10              # let the state settle before the first row

# --- when the frame was, and how long the game thought it was ---------------------------------------
[[field]]
name = "frame_counter"            # the app object's own tick counter, +1 per tick
addr = "@frame_counter"
type = "u32"

[[field]]
name = "dt"                       # the dt the simulation was given; 1/30 in play
addr = "@frame_dt"
type = "f32"

# The C library's 64-bit LCG state (R5): the number a replay has to start from, because the game draws
# from it and the port must draw the same. `Fixture::seed` is 32 bits wide, so only the low half of it
# survives into a fixture file today — see S8's journal entry.
[[field]]
name = "rng_state"
addr = "@rand_state"
type = "u64"

# --- the input, as the game's own input manager holds it ---------------------------------------------
# Sixteen controls, 0x18 bytes each; `held` is 1 while down. This is the input the simulation reads, so
# it is the one a fixture is built from: no bit permutation to guess, unlike the wire word below.
[[array]]
name   = "ctl"
addr   = "@pad0_control_state"
count  = 16
stride = 0x18

[[array.field]]
name = "held"
off  = 0
type = "u32"

# --- the input, as libpad left it on the wire -------------------------------------------------------
# Both 0x80-byte halves of port 0's buffer and both stamps, because `scePadRead` takes the half with
# the larger stamp and a PINE row is sampled *after* the tick — by which time the IOP has refreshed the
# other half, so the half the game actually read is the one with the *smaller* stamp (C5 measured this
# on 300 of 300 rows). Bytes [2..3] are the button word, active low; [4..7] are RX RY LX LY, centre
# 0x7f. The sticks come from here because the control state has no axes.
[[field]]
name = "pad_a"
addr = "@pad_buffers"
type = "bytes:20"

[[field]]
name = "stamp_a"
addr = "@pad0_stamp_a"
type = "u32"

[[field]]
name = "pad_b"
addr = "@pad_buffers + 0x80"
type = "bytes:20"

[[field]]
name = "stamp_b"
addr = "@pad0_stamp_b"
type = "u32"

# --- the bike: what the port is judged on -----------------------------------------------------------
# R6's chain, one arrow at a time: the GameManager singleton -> the actor manager (+0x34) -> its list
# head (+0x34) -> *eight* `next` hops (+0x8) -> that node's item (+0x0) -> a field of the actor.
#
# Eight, not five. S8 measured the list in the acceptance recording's own save state: a freeride area
# on Free09 holds **four** type-4 vehicles — the human's and three AI riders — and the fifth list entry
# is an AI's, flying past at 27 units/s while the human's bike idles. The only field that tells them
# apart is the control source on the player record (`-> 0x20 -> 0x34`): 1 is a local human, 2 is an AI.
# `bike_type == 4` and a non-null player both read true on an AI's vehicle, so they are not enough; the
# capture carries `bike_ctl_src` and S8's reader refuses a capture whose every row is not 1.
[[field]]
name = "bike_type"                # +0x00: must read 4 (a vehicle) or the hop count is wrong
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x0"
type = "u32"

[[field]]
name = "bike_ctl_src"             # +0x20 -> +0x34: the player record's control source; 1 = local human
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x20 -> 0x34"
type = "u32"

[[field]]
name = "bike_player"              # +0x20: the player record it belongs to; 0 means nobody is riding it
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x20"
type = "u32"

[[field]]
name = "bike_vel"                 # +0x130: velocity, world units per second
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x130"
type = "f32x4"

[[field]]
name = "bike_xform"               # +0x180: 4x4 world transform; row 3 (+0x1b0) is the position
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x180"
type = "mat4"

# --- the rider, so one playback also answers S14's open question -------------------------------------
# The human says there is a collision with an NPC rider somewhere in this minute, and S14 could not
# measure which frame: the number in use is an inference from the tape's idle window (video ~1019,
# tick ~510). The wreck reason below settles it with no second sitting at the GUI — the first row where
# `wreck_reason` is not 0 is the contact, and it bounds the tick-exact window the acceptance test can
# claim. Two hops land on the human's *rider* (the type-2 actor that carries the ride state), where the
# eight hops above land on the vehicle; the two guards say so on every row.
[[field]]
name = "rider_type"               # +0x00: 2 = a rider
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x0"
type = "u32"
required = true

[[field]]
name = "rider_ctl_src"            # +0x20 -> +0x34: 1 = a local human, 2 = an AI
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x20 -> 0x34"
type = "u32"
required = true

[[field]]
name = "wreck_reason"             # +0x748: 0 while riding; the wreck reason while being put back on
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x748"
type = "u32"

# +0x550: `g_peak`, the per-lane signed max-by-magnitude body-frame acceleration over the frame's
# substeps — the column S22 fixed the port against on a standing bike. On a real minute of riding it is
# the reference for every jump and landing in the tape, which is worth having from the same capture.
[[field]]
name = "g_peak"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x550"
type = "f32x4"

# --- the rider in the air and mid-trick (C6, for the second recording) ------------------------------
# The second human recording (`context/recordings/recording2.p2m2`) has bails, tricks and backflips in
# it, and the four tasks after C6 need to see them tick by tick. All of these sit on the rider actor —
# the same object S10's air step and S11's trick machine are handed — so they share the two-hop chain
# above. The offsets are S10's and S11's (research/journal/2026-10-15-s10-s10-air,
# research/journal/2026-10-15-s11-s11-tricks); every one is a 32-bit word unless the type says so.
#
# The air step (`bike_air_state`): which wheels touch, written once per substep, so a row holds the
# last substep's answer.
[[field]]
name = "on_ground"                # +0x574: either wheel touches
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x574"
type = "u32"

[[field]]
name = "both_wheels"              # +0x578: both wheels touch
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x578"
type = "u32"

[[field]]
name = "airborne"                 # +0x57c: neither wheel touches
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x57c"
type = "u32"

# The backflip (`bike_backflip`). Two words make its state: `flip_on` 0 / `flip_arm` 0 is waiting for a
# lip; 0 / 1 is armed (the stick went forward on the lip); 1 / 0 is fired and inside the 0.6 s grace in
# which the wheels have to leave the ground (`flip_grace` counts it down); 1 / 1 is turning. The torque
# is the vector added to the chassis while it turns; `flip_torqued` is 1 on a frame it was, and
# `flip_ramp` is 1 from the first turning frame until the control ramp starts.
[[field]]
name = "flip_torqued"             # +0x4f4
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x4f4"
type = "u32"

[[field]]
name = "flip_ramp"                # +0x4f8
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x4f8"
type = "u32"

[[field]]
name = "flip_on"                  # +0x4fc: fired
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x4fc"
type = "u32"

[[field]]
name = "flip_arm"                 # +0x500: armed before firing, off the ground after
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x500"
type = "u32"

[[field]]
name = "flip_grace"               # +0x50c: seconds left to leave the ground after firing
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x50c"
type = "f32"

[[field]]
name = "flip_torque"              # +0x520: the torque, added to the chassis' +0x140 while it turns
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x520"
type = "f32x4"

# The trick machine (`pad_to_gesture`, `stunt_request`, `stunt_clocks`). Ids 0..23 are the 24 gesture
# slots, (group-1)*4 + (direction-1); 24 is the backflip, 25 the wheelie/lean, 26 the stoppie and 28
# "nothing" (what a reset writes).
[[field]]
name = "fresh"                    # +0x750: just put back on the bike; no trick may start
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x750"
type = "u32"

[[field]]
name = "trick_latched"            # +0x864: the requested id as packed for the network, read by the clocks
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x864"
type = "u32"

[[field]]
name = "trick_group"              # +0x9fc: the button group held, 0..6
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x9fc"
type = "u32"

[[field]]
name = "trick_dir"                # +0xa00: the direction, 0 none, 1 up, 2 down, 3 left, 4 right
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa00"
type = "u32"

[[field]]
name = "trick_count"              # +0xa04: the request count
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa04"
type = "u32"

[[field]]
name = "trick_running"            # +0xa0c: in progress
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa0c"
type = "u32"

[[field]]
name = "trick_safe"               # +0xa10: past SafeTime, a landing now is not a wreck
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa10"
type = "u32"

[[field]]
name = "trick_armed"              # +0xa18
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa18"
type = "u32"

[[field]]
name = "trick_elapsed"            # +0xa1c: seconds into the running trick
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa1c"
type = "f32"

[[field]]
name = "trick_id"                 # +0xa78: the id the clocks are running
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa78"
type = "u32"

[[field]]
name = "trick_req"                # +0xa7c: the id requested
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa7c"
type = "u32"
