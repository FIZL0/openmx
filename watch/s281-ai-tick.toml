# s281-ai-tick.toml — the three free09 AI riders' tick (S281): each brain's flags, speed, forward
# height, controls, climb and stuck clocks, aim and heading, and its bike's levers and overrides, from
# slot 44 of copy 1 (recording2's session a few hundred feet on: same heap, so fixed addresses). No pad.
#
#   ./kit pcsx2 with -- ./kit record watch/s281-ai-tick.toml -o context/capture/s281/ai-tick.csv
#
# The brains are the MXVehicleAI objects (vtable at +8) whose mode +0xd0 is 5; the riders are each
# brain's interface (+0x40) less 0x10d0.

[watch]
name        = "s281-ai-tick"
description = "free09's three AI riders: brain tick fields and the bike levers they hand off to"
every       = 1
frames      = 900

[setup]
state     = 44
warmup    = 0
settle_ms = 240

[[field]]
name = "clock"
addr = "0xd5090c"
type = "f32"

[[field]]
name = "b0_flags_lo"
addr = "0x1483ee0"
type = "u32"

