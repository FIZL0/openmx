# s241-strike.toml — the biplane and free06's six EyeBalls, one row a tick (S241).
#
# The plane (MXBiplane 0x00c44a40, every state made from biplane.p2m2's): its body (+0x160 ->: +0x00
# enabled, +0x60 position, +0x70 velocity, +0x170 quat, +0x1b0 rates), its crash word +0x3b0 and clock
# +0x3bc, its collision record (+0x170 -> +0x40 touching flags, +0x100 contact count). The balls: each
# body (+0x00 enabled, +0x60 position, +0x70 velocity, +0x1b0 rates) and its collision record's count.
# research/s241/aim.py rolls the plane at a ball; research/s241/strike.py records this from its state
# and saves states around the strike:
#
#   KIT_PCSX2=2 ./kit pcsx2 with -- python3 -B research/s241/strike.py NAME SLOT BALL

[watch]
name        = "s241-strike"
description = "the biplane and free06's EyeBalls, a row a tick"
every       = 1
frames      = 600

[setup]
warmup    = 0
settle_ms = 240

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "dt"
addr = "@frame_dt"
type = "f32"

[[field]]
name = "crash"
addr = "0xc44a40 + 0x3b0"
type = "u32"

[[field]]
name = "crash_time"
addr = "0xc44a40 + 0x3bc"
type = "f32"

[[field]]
name = "plane_touch"
addr = "0xc44a40 + 0x170 -> 0x40"
type = "bytes:16"

[[field]]
name = "plane_contacts"
addr = "0xc44a40 + 0x170 -> 0x100"
type = "u32"

[[field]]
name = "body_pos"
addr = "0xc44a40 + 0x160 -> 0x60"
type = "f32x4"

[[field]]
name = "body_vel"
addr = "0xc44a40 + 0x160 -> 0x70"
type = "f32x4"

[[field]]
name = "body_quat"
addr = "0xc44a40 + 0x160 -> 0x170"
type = "f32x4"

[[field]]
name = "body_rates"
addr = "0xc44a40 + 0x160 -> 0x1b0"
type = "f32x4"

