# s56-ragdoll.toml — the original's ragdoll while the human's rider wrecks: every bone's body, per tick.
# S56's spec. Driven by research/s56_wreck.py, which runs this through `ps2kit.record` and saves a state
# the tick the wreck starts, so a test can start the port from the original's own bones.
#
#   python3 -B research/s56_wreck.py <name> --pad <script>       # see its docstring
#   ./kit record --dry-run watch/s56-ragdoll.toml                # check the spec, no emulator
#
# ## Where the bones are
#
# The human's vehicle is acceptance.toml's eight-hop list item (`bike_*`, a type-4 actor, control
# source 1). The **rider body actor** sits 0x400 in front of it, as rider-joints.toml's animation object
# does (they are one object): the one tests/ragdoll.rs reads at a fixed address in the first
# recording's state. Its +0x14 is *another* rider's body actor, which is what a first try of this
# spec followed and captured an AI rider's wreck by. Its fields, named in research/oracle.txt under
# S50–S52:
#
#   * +0x2f4: the eighteen parts, stride 0xb0; a part's +0xa4 is its bone's rigid body and +0x40 its
#     skeleton joint. A body: +0x50 last position, +0x60 position, +0x70 velocity, +0x150 last
#     quaternion, +0x170 quaternion, +0x1b0 angular rates;
#   * +0x234: the skeleton's joints, stride 0x60, +0x50 each joint's blended quaternion: the rests the
#     wreck's joint torques pull towards (tests/ragdoll.rs `rest_at`);
#   * +0x5d0..+0x5dc the four holds (pins: +4 on, +0x60 -> the point followed, +0x64 -> its velocity),
#     +0x5f8 the bike box, +0x624 the nine bone collisions (+4 on, +0x14 touched), +0x62c the throw
#     force (+0 on), +0x488 the riding request the bike carrier is read from;
#   * the wreck's flags and clocks: +0x2a4..+0x2d0, +0x47c..+0x49c, +0x644..+0x6e0.
#
# `every = 1`: the comparison is per tick.

[watch]
name        = "s56-ragdoll"
description = "the original's rider ragdoll, every bone's body and the wreck state, one row a tick"
every       = 1
frames      = 600

[setup]
warmup = 0

