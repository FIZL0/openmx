type = "u32"

[[field]]
name = "plane1_plane_class"           # +0x48: the class vtable; the biplane class, the same on every row
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x0 -> 0x48"
type = "u32"

[[field]]
name = "plane1_plane_player"          # +0x20: the player record flying it; 0 once nobody is
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x0 -> 0x20"
