# s64-wheels.toml — s8-start.toml's run with the rest of each wheel's spin-step state.
#
# S64: the save-state run seeds both wheels from the RAM image, but s8-start.csv carries only the
# suspension half of a wheel. This is the same run (same state, no warmup, the same 60 ms settle, an
# idle pad) with every s8-start field plus the tire's half: the slip flags (+0xe0 spinning, +0xe4
# locked, +0xe8 sliding), the contact patch's local velocity (+0x840) and force (+0x850), the wheel's
# angle (+0x1d0), its side force per load (+0x234), drive torque (+0x210), steer rate (+0x8b0), and
# the rider's balance command/point (+0xa60/+0xa64), and the chassis integrator's four histories
# (+0x2b8..+0x31c).
#
# Recorded at a quarter speed: at full speed the recorder reads each row a frame late and misses
# tick 1 (and its phase can slip on a re-record). At a quarter it reads a row before its frame, so the
# first row (2775) is tick 1. A quarter speed needs settle_ms 240 (60 finds rider_type null), and the
# emulator copy stopped to change its speed:
#
#   cp context/recordings/first_recording.p2m2_SaveState.p2s \
#      "<copy>/PCSX2/savestates/SLUS-20767 (9866FE54).08.p2s"         # slot 8 = the recording's state
#   ./kit pcsx2 stop; (copy's PCSX2.ini) [Framerate] NominalScalar = 0.25; ./kit pcsx2 start
#   ./kit pcsx2 with -- ./kit record <this file, settle_ms = 240> --state 8 -n 120 \
#       -o context/capture/s64-slow/s64-wheels-quarter.csv
#   (NominalScalar back to 1.0 after)
#
# replay.rs reads it as S64_WHEELS; a row the recorder was late for shows as the row after it
# repeating its state, and quarter_ticks moves it a tick on.

[watch]
name        = "s64-wheels"
description = "s8-start's first ticks with each wheel's slip, local velocity and force"
every       = 1
frames      = 120

[setup]
state   = 8              # the human recording's own save state (free09, cr125_faisst)
warmup  = 0
settle_ms = 60

# --- when the frame was ------------------------------------------------------------------------------
[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "dt"              # pinned at the 30 fps clamp in a level: 0.033330001
addr = "@frame_dt"
type = "f32"

# --- which actor this is -----------------------------------------------------------------------------
[[field]]
name = "rider_type"      # +0x00: 2 = a rider
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x0"
type = "u32"
required = true

[[field]]
name = "rider_ctl_src"   # +0x20 -> +0x34: 1 = a local human, 2 = an AI
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x20 -> 0x34"
type = "u32"
required = true

# --- what the wreck test reads -----------------------------------------------------------------------
# +0x550: the per-lane signed max-by-magnitude of the body-frame acceleration over the frame's
# substeps (`g_peak`). x is the sideways lane the side wreck test compares against
# SideWreckSpeedLimit; y is the vertical lane. This is the column P3's port blows up and the original
# must not.
[[field]]
name = "g_peak"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x550"
type = "f32x4"

[[field]]
name = "wreck_reason"    # +0x748: 0 while riding
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x748"
type = "u32"

# --- the chassis the solver moves (rider +0x7a4) ------------------------------------------------------
[[field]]
name = "ch_accel"        # +0x70: the acceleration `g_peak` unrotates
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x70"
type = "f32x4"

[[field]]
name = "ch_cofg"         # +0x60: centre of gravity in world space
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x60"
type = "f32x4"

[[field]]
name = "ch_force"        # +0x130: the force accumulator at the end of the frame
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x130"
type = "f32x4"

[[field]]
name = "ch_torque"       # +0x140
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x140"
type = "f32x4"

[[field]]
name = "ch_vel"          # +0x260: world velocity
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x260"
type = "f32x4"

[[field]]
name = "ch_body_vel"     # +0x270: the same velocity in the body frame
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x270"
type = "f32x4"

[[field]]
name = "ch_ang_vel"      # +0x280: world angular velocity — the lane a ringing solver shows first
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x280"
type = "f32x4"

# +0x170: the *impact* acceleration accumulator — cleared once a frame beside the g loads and written
# only by the bottom-out branch of `wheel_tire_forces`, which takes the into-the-ground part out of the
# chassis' velocity and records what it took over dt. This is the vector the ground step unrotates into
# the g loads, and the port feeds them the integrate's own +0x70 instead. Both are in this capture so
# the swap is a column comparison and not an argument.
[[field]]
name = "ch_impact"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x170"
type = "f32x4"

# +0x80: the angular acceleration the integrate writes, and +0x180 the angular half of the impact
# accumulator the same clear empties.
[[field]]
name = "ch_ang_accel"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x80"
type = "f32x4"

[[field]]
name = "ch_ang_impact"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x180"
type = "f32x4"

# --- the front wheel (rider +0x7b0) ------------------------------------------------------------------
# The mount and the probe length are static, and are here to pin the geometry the solver runs on: the
# port's shell feeds `BodyTireForcePosition` as the mount and `StrutCompression` as the probe length,
# and the save state says the original's are the bike model's TireFront/TireRear nodes and the tire
# radius. One capture row proves both against the running game.
[[field]]
name = "f_mount"         # +0xa0: where the strut hangs off the chassis, body frame
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0xa0"
type = "f32x4"

[[field]]
name = "f_probe_len"     # +0x214
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0x214"
type = "f32"

[[field]]
name = "f_spring_rate"   # +0x54, +0x58 damping in, +0x5c damping out
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0x54"
type = "f32"

[[field]]
name = "f_damp_in"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0x58"
type = "f32"

[[field]]
name = "f_damp_out"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0x5c"
type = "f32"

[[field]]
name = "f_comp"          # +0xf0: compression, 0..max
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0xf0"
type = "f32"

[[field]]
name = "f_last_comp"     # +0xf4: last frame's, the damper's input
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0xf4"
type = "f32"

[[field]]
name = "f_spring_force"  # +0xf8: the load this wheel carries, lbf
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0xf8"
type = "f32"

[[field]]
name = "f_ray_hit"       # +0xd0: the probe found ground this substep
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0xd0"
type = "u32"

[[field]]
name = "f_load_point"    # +0x140: where the tire force is applied, world
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0x140"
type = "f32x4"

[[field]]
name = "f_normal"        # +0x200: the ground normal under the wheel
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0x200"
type = "f32x4"

[[field]]
name = "f_contact_vel"   # +0x170: the velocity of the contact point
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7b0 -> 0x170"
type = "f32x4"

