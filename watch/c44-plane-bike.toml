# c44-plane-bike.toml — written by research/c44/spec.py (C44): biplane.p2m2's plane parked in an AI
# rider's way on free06, the three AI bikes and the plane, one row a tick.

[watch]
name        = "c44-plane-bike"
description = "the parked biplane and free06's three AI bikes: chassis, levers, collision lists"
every       = 1
frames      = 600

[setup]
warmup    = 0
settle_ms = 240

