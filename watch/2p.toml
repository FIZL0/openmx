type = "u32"

[[field]]
name = "pad0_a"
addr = "@pad_buffers"
type = "bytes:20"

[[field]]
name = "pad0_b"
addr = "@pad_buffers + 0x80"
type = "bytes:20"

[[field]]
name = "pad1_a"
addr = "@pad_buffers + 0x400"
type = "bytes:20"

[[field]]
name = "pad1_b"
addr = "@pad_buffers + 0x480"
