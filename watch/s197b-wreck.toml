# s197b-wreck.toml — free09's five beach balls, the human's bike and its wreck bike, one row a tick (S197b).
#
# watch/s195-knock.toml's fields (the balls' bodies, node origins, record flags and countdowns, the
# bike's chassis) and the wreck bike's, at the addresses it has in every state made from
# first_recording's: its body 0x00dc8980 (+0x00 enabled, +0x60 position, +0x70 velocity, +0x170 quat,
# +0x1b0 rates) and its collision object 0x00dc98f0 (+0x40.. touching, touching another, on the ground,
# on an object), filed on free09's props node 0x00e17ef0 with the balls'. research/s197b/drop.py drops the bike hard beside a ball; research/s197b/wreck.py records
# this from its state and saves states around the strike:
#
#   KIT_PCSX2=2 ./kit pcsx2 with -- python3 -B research/s197b/wreck.py NAME SLOT BALL

[watch]
name        = "s197b-wreck"
description = "free09's beach balls, the human's bike and its wreck bike, a row a tick"
every       = 1
frames      = 600

[setup]
warmup    = 0
settle_ms = 240

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "dt"
addr = "@frame_dt"
type = "f32"

[[field]]
name = "rider_ctl_src"  # 1 = the local human
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x20 -> 0x34"
type = "u32"

[[field]]
name = "wreck_reason"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x748"
type = "u32"

[[field]]
name = "ch_cofg"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7a4 -> 0x60"
type = "f32x4"

[[field]]
