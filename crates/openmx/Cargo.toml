[package]
name = "openmx"
description = "The playable shell: a window, a real pad, the ported simulation at 60 Hz, and the freeride area drawn with the port's own renderer"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "openmx"
path = "src/main.rs"

# The browser's build (N4): the part of the shell a web page runs, as a WebAssembly module with no
# bindings crate (`tools/web.sh`). An rlib as well, so the desktop's tests can draw the same frame.
[lib]
name = "openmx_web"
path = "src/web.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The simulation (input layer, fixed update, track, collision) and the renderer. Nothing else: the
# window, the pad and the frame pacing are all std, the same way the rest of this workspace has no
# dependency outside it.
game-sim = { path = "../game-sim" }
game-render = { path = "../game-render" }
ps2-float = { path = "../ps2-float" }
