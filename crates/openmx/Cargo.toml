[package]
name = "openmx"
description = "The playable shell: a window, a real pad, the ported simulation at 60 Hz, and the freeride area drawn with the port's own renderer"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "openmx"
path = "src/main.rs"

# The iPhone's build (P200): the UIKit, GameController, CoreMotion and AudioToolbox calls, which
# are unsafe, in a crate of their own so this one goes on forbidding unsafe code.
[target.'cfg(target_os = "ios")'.dependencies]
openmx-ios = { path = "../openmx-ios" }

# The browser's build (N4): the part of the shell a web page runs, as a WebAssembly module with no
# bindings crate (`tools/web.sh`). An rlib as well, so the desktop's tests can draw the same frame.
[lib]
name = "openmx_web"
path = "src/web.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The simulation (input layer, fixed update, track, collision) and the renderer. The window, the pad
# and the frame pacing are all std; online play's three are below.
game-sim = { path = "../game-sim" }
# Without its GPU half here: the desktop's and the browser's builds each turn it on below.
game-render = { path = "../game-render", default-features = false }
ps2-float = { path = "../ps2-float" }
# The stitcher (P232): the joins of MX Unleashed's worlds, built off the player's disc, and mod.json's
# JSON, which the shell reads as the stitcher writes it.
stitch = { path = "../stitch" }
# Online play (N2, `src/net`): ggrs' rollback core as opentennis vendors it (third_party/ggrs, with its
# thread-drivable clock), its messages as bincode, and serde for the session's own messages. The
# shell's only dependencies from outside the workspace: the simulation takes none. N3's transport
# (iroh, crates/openmx-net) carries the session's datagrams for `src/peer.rs`, on both builds (N4).
ggrs = { path = "../../third_party/ggrs" }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
openmx-net = { path = "../openmx-net" }
# The mod store (P198, `src/modstore.rs`): its listing and meta.json as JSON, the download's sha256,
# the zip's deflate, and the store's preview.webp pictures. Every one already built for iroh or png
# but the WebP decoder, image-rs' own pure-Rust one. reqwest is openmx-net's: rustls natively, the
# page's fetch in the browser.
serde_json = "1"
sha2 = "0.11"
miniz_oxide = "0.8"
image-webp = "0.2"
reqwest = { version = "0.13", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The desktop draws on the GPU by default (P44): the renderer's wgpu half, and winit for a window a
# GPU surface can be made on — on Wayland or X11, and later on a phone. `--renderer software` keeps
# the hand-rolled X11 window (`src/window.rs`) and the rasteriser.
game-render = { path = "../game-render", features = ["gpu"] }
winit = "0.30"
pollster = "1"
# The menus' own type (P118): Saira (assets/fonts, OFL), read and outlined at load into
# the distance atlas both draw paths share; opentennis's menus (B136) take the same crate.
ab_glyph = "0.2"
# Replaced textures (V84): the key-named PNGs of texture packs, mods/texture-replacements and mods'
# upscales, read, and --dump-textures' written, as opentennis reads and writes them (its texhash.rs).
png = "0.18"
# The mod store's HTTPS (P198) on openmx-net's ring, and a runtime for each of its jobs' threads;
# `stream` (and tokio's fs) for an upload's mod.zip sent from the file, not read whole (P221).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt", "fs"] }
# The desktop updater (P191, `src/update.rs`): a release's SHA256SUMS is signed with minisign.
minisign-verify = "0.3"
# The sim thread (N23a, `src/sim_thread.rs`): a tick run on a thread of its own, kept for the ride,
# while the loop draws, with the loop's borrows — the safe scoped job a forbid-unsafe crate cannot
# write itself.
rayon-core = "1"

# The pad's motors (P183): a wreck rumbles its rider's pad as the original's does. The js device the
# pad is read through takes no force feedback; its sibling event node does, through an ioctl the shell
# (unsafe-free) leaves to the evdev crate.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
# the sound, pulled by the device (ALSA, PipeWire's) instead of piped to pw-cat
cpal = "0.16"

# The Windows build's pads and sound (WASAPI), P192. Pads through XInput, not gilrs' default Windows.Gaming.Input,
# which Wine and Proton pass no pad to. A PlayStation pad, which has no XInput driver, read through
# Windows.Gaming.Input's raw controllers on the side (the `windows` crate wgpu already pulls in).
[target.'cfg(windows)'.dependencies]
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }
windows = { version = "0.62", features = ["Gaming_Input"] }
cpal = "0.16"

# The browser's build (N4), as opentennis's is: wasm-bindgen for the page's calls, and ggrs' clock and
# random numbers from the page (its `wasm-bindgen` feature).
[target.'cfg(target_arch = "wasm32")'.dependencies]
ggrs = { path = "../../third_party/ggrs", features = ["wasm-bindgen"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# The desktop's whole front end and ride run in the page (P196), so it takes the shell's own: the
# renderer's GPU half on the page's canvas (P48: WebGPU, and WebGL2 where a browser has none), the
# menus' type and the replaced textures' PNGs; and wasm-bindgen's futures, which step the shell's
# loop a frame at a time off the page's clock.
game-render = { path = "../game-render", features = ["webgl"] }
# The OffscreenCanvas the worker hands the GPU (P48).
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }
ab_glyph = "0.2"
png = "0.18"
wasm-bindgen-futures = "0.4"
# The clock (`src/clock.rs`), which wasm32's std has none of.
web-time = "1"
# `src/main.rs` waits on its few futures with it on both builds (P196).
pollster = "1"

# F15's native sim: the simulation on the host's plain f32 instead of the PS2's arithmetic (ps2-float's
# `native`), about twice as fast on a Steam Deck and no longer the original bit for bit. The player
# builds turn it on (P262: tools/build.sh, tools/web.sh, tools/ios-ipa.sh, so the release, the beta and
# the Deck); `--exact-sim` there leaves it off. Off by default here, and it must stay so: plain `cargo
# run` and the ./kit check gate are the exact sim (tests/player_build.rs). The menu's corner, `--version`
# and the first line printed say so, the online build id carries it, so a native build refuses an exact
# peer, and its tapes say `sim native`.
[features]
native-sim = ["ps2-float/native"]

[dev-dependencies]
# tests/netplay_browser.rs's local relay: iroh's own relay server, as crates/openmx-net's tests run it
iroh-relay = { version = "1.3", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
# tests/audio.rs runs the original's engine note over a save state (P49)
ps2-oracle = { path = "../ps2-oracle" }
