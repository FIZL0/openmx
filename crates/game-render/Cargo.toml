[package]
name = "game-render"
description = "Draws the game's own models: disc -> meshes and textures -> pixels, with no engine and no dependencies"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# The disc's two archive formats live in the sim, which has no IO; this crate does the IO.
game-sim = { path = "../game-sim" }
# Not for arithmetic — this crate draws in host `f32`. A clip's timing record is the simulation's
# own (`game_sim::motion::Clip`), and its fields are `F`, so the type has to be nameable here.
ps2-float = { path = "../ps2-float" }

[dev-dependencies]
# The oracle is a *test* dependency: the port must not need the game's code to draw a frame.
ps2-oracle = { path = "../ps2-oracle" }
