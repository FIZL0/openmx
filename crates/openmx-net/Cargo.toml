[package]
name = "openmx-net"
description = "Finding and joining a game: iroh QUIC with hole punching and the host relaying, LAN by mDNS, four-character room codes through a pkarr relay, quickplay off the DHT board, and the handshake that refuses a peer whose ride would differ"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "openmx-net"
path = "src/main.rs"

[dependencies]
# The transport, as opentennis's `hst-base` builds it (its `net.rs`): iroh QUIC, tickets for the codes, tasks and
# timers through n0-future on tokio. The lobby list on the mainline DHT and the LAN's by mDNS. reqwest for the pkarr
# relay's HTTP (rustls on iroh's own ring). The only crates from outside the workspace besides N2's, and the
# simulation takes none of them.
iroh = "1.3"
iroh-tickets = "1"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
iroh-mainline-address-lookup = "0.6"
n0-mainline = "0.7"
iroh-mdns-address-lookup = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# netplay.rs's local relay: iroh's own relay server, on plain HTTP as `iroh-relay --dev` runs it
iroh-relay = { version = "1.3", features = ["server"] }
