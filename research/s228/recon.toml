# recon.toml — S228: what fly_and_collide.p2m2 does, cheaply: the actor list each tick (who flies what),
# both biplanes' body, speed and wreck words, both riders' chassis centre, speed and wreck reason.
# Played by research/c10/play_capture.sh with SPEC=research/s228/recon.toml.

[watch]
