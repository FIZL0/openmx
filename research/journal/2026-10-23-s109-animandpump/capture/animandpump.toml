# The whole riding request, from 0x200 before it (the hand dummies its +0xf0/+0xf4 point at) to
# 0x300 after, and the 0x100 its +0x1ac points at (the bike's centre and radius the off-bike test
# reads): what the body's update reads off the bike each tick, so a replay can lay it in.
[[field]]
