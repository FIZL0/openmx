# gate.toml: V61's second spec. recording2 played back: what stops the riding ragdoll's step while a
# trick runs. The body actor (vehicle - 0x400): +0x2a4 wreck mode, +0x2a8 repose, +0x2ac placed,
# +0x2b0 active (rider_physics_update steps the world only with placed && active && !repose); the
# riding request (actor +0x488): +0x8 live (rider_body_update clears placed without it), +0xc held;
# the body's animation machine: +0x680 the pose came off the clip table, +0x684 holding a pose.

[watch]
name        = "v61-gate"
description = "recording2 played back: the riding ragdoll's step gate through the tricks"
every       = 1
frames      = 1650

[setup]
warmup = 0

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "rider_type"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x0"
type = "u32"

[[field]]
name = "trick_running"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa0c"
type = "u32"

[[field]]
name = "trick_id"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa78"
type = "u32"

[[field]]
name = "flip_on"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x4fc"
type = "u32"

[[field]]
name = "airborne"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x57c"
type = "u32"

[[field]]
name = "wreck_mode"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x2a4 - 0x400"
type = "u32"

[[field]]
name = "repose"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x2a8 - 0x400"
type = "u32"

[[field]]
name = "placed"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x2ac - 0x400"
type = "u32"

[[field]]
name = "active"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x2b0 - 0x400"
type = "u32"

[[field]]
name = "req_live"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0x8"
type = "u32"

[[field]]
name = "req_held"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0xc"
type = "u32"

[[field]]
name = "hand0_pos"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x5d0 - 0x400 -> 0x68 -> 0x60"
type = "f32x4"

[[field]]
name = "from_table"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x680 - 0x400"
type = "u32"

[[field]]
name = "holding"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x684 - 0x400"
type = "u32"
