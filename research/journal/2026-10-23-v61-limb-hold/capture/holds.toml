# holds.toml: V61's spec. recording2 played back: the four hold pins of the human's rider body actor,
# the bodies they pull and the trick that is running. Generated by hand from watch/s56-ragdoll.toml's
# chains (recording2's state: the rider is the list's third node, the vehicle the ninth; the body actor
# sits 0x400 in front of the vehicle).
#
#   pin: +4 on, +0x20 the anchor in the body's frame, +0x40 the target, +0x50 the target's velocity,
#        +0x68 the body, +0x100 (inv mass, -, gain, c)
#   body: +0xc mass, +0x10 1/mass (body_set_mass), +0x60 position, +0x170 quaternion

[watch]
name        = "v61-holds"
description = "recording2 played back: the four hold pins, their bodies' masses and the trick running"
every       = 1
frames      = 1700

[setup]
warmup = 0

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "rider_type"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x0"
type = "u32"

[[field]]
name = "trick_running"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa0c"
type = "u32"

[[field]]
name = "trick_elapsed"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa1c"
type = "f32"

[[field]]
name = "trick_id"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa78"
type = "u32"

[[field]]
name = "airborne"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x57c"
type = "u32"

[[field]]
name = "wreck_reason"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x748"
type = "u32"

[[field]]
name = "pin0_on"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x5d0 - 0x400 -> 0x4"
type = "u32"

[[field]]
name = "pin0_anchor"
