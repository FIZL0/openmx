# c8.toml: C8's spec, V35's flips.toml plus the bike's motion, the trick buttons and the no-hander.
# V35's notes follow. recording2 played back through its first two backflips: what the rider's
# body plays. The body actor is the vehicle - 0x400 (V61's chain): +0x8ec/+0x8f0/+0x8f4 the previous,
# running and asked-for animation state, +0x8f8 last frame's progress, +0x680 from_table, +0x684
# holding, +0x68c/+0x690 the cross-fade ramp and its rate, +0x2ac placed; the request (actor +0x488):
# +0xf8 airborne, +0xfc a backflip, +0x100 no-hander, +0x104 wreck, +0x1a0 the gesture slot. On the
# bike R: +0x4f4 the flip torque applied, +0x4f8 flipping, +0x4fc the flip triggered, +0x500 armed
# (bike_backflip), +0x57c airborne, +0xa0c a trick running, +0xa78 the trick id.

[watch]
name        = "c8-flip-and-nohander"
description = "C8's tape (recording2 with an uncut backflip and a no-hander) played back: the bike, the trick and the body"
every       = 1
frames      = 440

[setup]
warmup = 0

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "rider_type"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x0"
type = "u32"

[[field]]
name = "trick_running"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa0c"
type = "u32"

[[field]]
name = "trick_id"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa78"
type = "u32"

[[field]]
name = "airborne"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x57c"
type = "u32"

[[field]]
name = "flip_applied"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x4f4"
type = "u32"

[[field]]
name = "flipping"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x4f8"
type = "u32"

[[field]]
name = "flip_active"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x4fc"
type = "u32"

[[field]]
name = "flip_armed"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x500"
type = "u32"

[[field]]
name = "wreck_reason"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x748"
type = "u32"

[[field]]
name = "state_prev"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x8ec - 0x400"
type = "u32"

[[field]]
name = "state"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x8f0 - 0x400"
type = "u32"

[[field]]
name = "state_want"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x8f4 - 0x400"
type = "u32"

[[field]]
name = "progress_last"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x8f8 - 0x400"
type = "f32"

[[field]]
name = "from_table"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x680 - 0x400"
type = "u32"

[[field]]
name = "holding"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x684 - 0x400"
type = "u32"

[[field]]
name = "ramp"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x68c - 0x400"
type = "f32"

[[field]]
name = "ramp_rate"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x690 - 0x400"
type = "f32"

[[field]]
name = "placed"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x2ac - 0x400"
type = "u32"

[[field]]
name = "req_airborne"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0xf8"
type = "u32"

[[field]]
name = "req_backflip"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0xfc"
type = "u32"

[[field]]
name = "req_no_hander"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0x100"
type = "u32"

[[field]]
name = "req_wreck"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0x104"
type = "u32"

[[field]]
name = "req_gesture"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0x1a0"
type = "u32"

[[field]]
name = "dt"                       # the dt the simulation was given; 1/30 in play
addr = "@frame_dt"
type = "f32"

[[array]]
name   = "ctl"
addr   = "@pad0_control_state"
count  = 16
stride = 0x18

[[array.field]]
name = "held"
off  = 0
type = "u32"

[[field]]
name = "bike_vel"                 # +0x130: velocity, world units per second
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x130"
type = "f32x4"

[[field]]
name = "bike_xform"               # +0x180: 4x4 world transform; row 3 (+0x1b0) is the position
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x180"
type = "mat4"

[[field]]
name = "on_ground"                # +0x574: either wheel touches
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x574"
type = "u32"

[[field]]
name = "trick_group"              # +0x9fc: the button group held, 0..6
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x9fc"
type = "u32"

[[field]]
name = "trick_dir"                # +0xa00: the direction, 0 none, 1 up, 2 down, 3 left, 4 right
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa00"
type = "u32"

[[field]]
name = "trick_safe"               # +0xa10: past SafeTime, a landing now is not a wreck
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa10"
type = "u32"

[[field]]
name = "trick_elapsed"            # +0xa1c: seconds into the running trick
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa1c"
type = "f32"

[[field]]
name = "s31_stick"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x620"
type = "f32x4"

[[field]]
name = "no_hander"                # +0xa44: the no-hander held with a wheel down (the request's +0x100)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0xa44"
type = "u32"
