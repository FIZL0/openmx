addr = "0x1853468 -> 0x0 -> 0x734"
type = "u32"

[[field]]
name = "free_flags"  # the human's freeride card, read straight: it leaves the manager at the end
addr = "0x1c833c8"
type = "u32"

[[field]]
name = "free_total"  # its total: seeded before the join, put back by the end
addr = "0x1c8349c"
type = "u32"
