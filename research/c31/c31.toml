# c31.toml -- written by research/c31/spec.py; do not edit by hand.
# C31: an sx01 single race, every score card per tick (research/c31/README.md).

[watch]
name        = "c31-sx01-laps"
description = "sx01 single race, 4 AI-ridden riders: the score manager and every card per tick"
every       = 1
frames      = 12000
start       = "in_game == 1"

[setup]
warmup = 0

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "dt"
addr = "@frame_dt"
type = "f32"

[[field]]
name = "rng_state"
addr = "@rand_state"
type = "u64"

[[field]]
name = "in_game"
addr = "0x004e2650"
type = "u32"

[[field]]
name = "mgr_flags"
addr = "@activity_manager -> 0x58 -> 0x0 -> 0xac"
type = "u32"

[[field]]
name = "mgr_kind"
addr = "@activity_manager -> 0x58 -> 0x0 -> 0xb0"
type = "s32"

[[field]]
name = "mgr_handler"
addr = "@activity_manager -> 0x58 -> 0x0 -> 0xb4"
type = "s32"

[[field]]
name = "mgr_laps"
addr = "@activity_manager -> 0x58 -> 0x0 -> 0xe4"
type = "s32"

[[field]]
name = "mgr_b8"
addr = "@activity_manager -> 0x58 -> 0x0 -> 0x108"
type = "f32"

[[field]]
name = "mgr_count_len"
addr = "@activity_manager -> 0x58 -> 0x0 -> 0x10c"
type = "f32"

[[field]]
name = "mgr_count_elapsed"
addr = "@activity_manager -> 0x58 -> 0x0 -> 0x114"
type = "f32"

[[field]]
name = "mgr_raw"
addr = "@activity_manager -> 0x58 -> 0x0 -> 0x50"
type = "bytes:272"

