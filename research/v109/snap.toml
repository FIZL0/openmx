# V109: generated by research/v109/make_spec.py (edit that, not this). Played by
# research/c10/play_capture.sh with SPEC=research/v109/snap.toml, FIRST 139950, N 471.

[watch]
name        = "v109-snap"
description = "the 2p tape's reverse and air fades: posed joints, their nodes and the snapshot"
every       = 1
frames      = 471

[setup]
warmup = 0

[[field]]
name = "frame_counter"
addr = "@frame_counter"
type = "u32"

[[field]]
name = "dt"
addr = "@frame_dt"
type = "f32"

[[field]]
name = "p1_type"  # 2 = the ridden vehicle
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x0"
type = "u32"

[[field]]
name = "p1_joint_count"  # 22
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x230 - 0x400"
type = "u32"

[[field]]
name = "p1_mode"  # 0 placed, 1 riding, 2 wreck ragdoll, 3 table/hold, 4 start/look
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x47c - 0x400"
type = "s32"

[[field]]
name = "p1_rag_flags"  # riding, repose, placed, active, stiff, torques
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x2a4 - 0x400"
type = "bytes:24"

[[field]]
name = "p1_settled"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x6b4 - 0x400"
type = "u32"

[[field]]
name = "p1_m_clock"  # +0x48 clip, +0x4c from, +0x50 last, +0x54 time, +0x80.. fade
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x48 - 0x400"
type = "bytes:80"

[[field]]
name = "p1_d_flags"  # the machine: +0x68c ramp
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x680 - 0x400"
type = "bytes:40"

[[field]]
name = "p1_d_cross"  # +0x8f0 state, +0x8f4 want
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x8dc - 0x400"
type = "bytes:36"

[[field]]
name = "p1_d_reverse"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0xa3c - 0x400"
type = "f32"

[[field]]
name = "p1_lag_mix"  # the lag record stepped first, the mix axis: {value, tau, ratio} (C11)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x630 - 0x400 -> 0x0"
type = "f32x3"

[[field]]
name = "p1_lag_phase"  # the lag record stepped second, the phase axis: {value, tau, ratio} (C11)
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x634 - 0x400 -> 0x0"
type = "f32x3"

[[field]]
name = "p1_req_placing"  # the request: placement flag
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0xc"
type = "u32"

[[field]]
name = "p1_req_axes"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x488 - 0x400 -> 0x170"
type = "f32x3"

[[field]]
name = "p1_airborne"  # neither wheel touches
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x57c"
type = "u32"

[[array]]
name   = "p1_j"  # the 22 posed joints and their transform nodes' local matrices
addr   = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x8 -> 0x8 -> 0x0 -> 0x234 - 0x400 -> 0x0"
count  = 22
stride = 0x60

[[array.field]]
