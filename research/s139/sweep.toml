# --- S139: the chassis sweep back (bike +0x7d0 the collision record, +0x7cc its sweep probe) -----------
# The record's swept segment, from (+0xd0) .. to (+0xe0): to = the chassis node's position + its rotation
# of the offset, from = to - the chassis velocity x lead x dt. Written every tick the sweep runs.

[[field]]
name = "sw_from"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7d0 -> 0xd0"
type = "f32x4"

[[field]]
name = "sw_to"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7d0 -> 0xe0"
type = "f32x4"

# The sweep probe's flag byte: 0x20 = its last search hit (cleared by the probe's clear each search).

[[field]]
name = "sw_flags"
addr = "@game_manager -> 0x34 -> 0x34 -> 0x8 -> 0x8 -> 0x0 -> 0x7cc -> 0x116"
type = "u8"

# Its result (+0x6c): +0x20 the push direction, +0x30 the hit point the node is put back from.

