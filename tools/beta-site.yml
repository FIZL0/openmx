# The whole of FIZL0/openmx-beta (as .github/workflows/deploy.yml): that repo holds no site, only this, as
# opentennis-beta does. Each beta run of openmx's pages.yml leaves the whole beta site (website + /download/,
# tools/beta-bundle.sh) as beta-site.tar.gz on a draft release of that repo and dispatches this with the draft's id; it
# puts the bundle on its GitHub Pages (custom domain beta.openmx.dev). B43 (opentennis's B745): the beta is no
# release of FIZL0/openmx any more (Quiver Launcher took the rolling `beta` for the newest version); drafts are
# hidden, so nothing here is offered as a version either. Run it by hand from that repo's Actions tab too (the newest
# draft). pages.yml checks this file has "beta-site.tar.gz" in it before it stops making the old release: copy this
# file there when it changes. With no draft yet, it deploys the old `beta` release's website as before (only until
# the first B43 beta run).
name: deploy
on:
  repository_dispatch:
    types: [beta]
  workflow_dispatch:
permissions:
  contents: write  # drafts are only visible with push access
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # upload and deploy in separate jobs (GitHub's Pages layout; opentennis's B755: in one job deploy-pages sometimes
  # found no artifact half a second after the upload)
  build:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ github.event.client_payload.release }}
        run: |
          mkdir web
          [ -n "$ID" ] || ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" -q '[.[] | select(.draft)][0].id')
          if [ -z "$ID" ] || [ "$ID" = null ]; then
            echo "no beta draft yet: the old beta release's website"
            gh release download beta -R FIZL0/openmx -p web.tar.gz -O - | tar xz -C web
            exit 0
          fi
          [[ $ID =~ ^[0-9]+$ ]] || { echo "::error::bad release id $ID"; exit 1; }
          a=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID" -q '.assets[] | select(.name == "beta-site.tar.gz") | .id')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$a" -H 'Accept: application/octet-stream' | tar xz -C web
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
