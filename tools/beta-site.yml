# The whole of FIZL0/openmx-beta (as .github/workflows/deploy.yml): that repo holds no site, only this, as
# opentennis-beta does. It puts the `beta` release's web.tar.gz on its GitHub Pages (custom domain beta.openmx.dev).
# Each beta run of openmx's pages.yml dispatches it (secret BETA_DISPATCH_TOKEN there); without that token, the
# half-hourly check below deploys whenever the site's version.txt is not the beta release's. Run it by hand from that
# repo's Actions tab too.
name: deploy
on:
  repository_dispatch:
    types: [beta]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: get
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir web
          gh release download beta -R FIZL0/openmx -p web.tar.gz -O - | tar xz -C web
          live=$(curl -fsS https://beta.openmx.dev/version.txt 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ -n "$live" ] && [ "$live" = "$(cat web/version.txt)" ]; then
            echo "beta.openmx.dev already shows $live"
          else
            echo go=1 >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.get.outputs.go }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: web
      - if: ${{ steps.get.outputs.go }}
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
