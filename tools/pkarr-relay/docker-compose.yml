# N3: a pkarr relay, a code server for room codes (from opentennis's tools/pkarr-relay). openmx runs none of its own:
# the game asks online.txt's code_server first and https://relay.pkarr.org after it. `docker compose up -d`, or on
# TrueNAS: Apps → Discover → ⋮ → Install via YAML, paste this. Put nginx (nginx.conf here) in front for HTTPS. Forward
# UDP 6881 for a healthier DHT.
name: pkarr-relay
services:
  relay:
    build: https://github.com/pubky/pkarr.git#v8.1.0
    restart: unless-stopped
    command: pkarr-relay --config=/config.toml
    ports:
      - "6881:6881/tcp"   # HTTP API (nginx proxies here)
      - "6881:6881/udp"   # mainline DHT
    volumes:
      - cache:/cache
    configs:
      - source: relay
        target: /config.toml
configs:
  relay:
    content: |
      [http]
      port = 6881
      [mainline]
      port = 6881
      [cache]
      path = "/cache"
      size = 1_000_000
      # Generous limits: a whole house of devices behind one IP must fit (the public relay's 10 didn't).
      [rate_limiter]
      behind_proxy = true
      quota = "20r/s"
      burst = 200
      # All four are required (the relay won't start without them).
      dht_quota = "10r/s"
      dht_burst = 50
      user_dht_quota = "10r/s"
      user_dht_burst = 100
volumes:
  cache:
