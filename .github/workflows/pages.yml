# The beta and the website, as opentennis's pages.yml (no game data anywhere: players pick their own ISO).
# - Every push to main is a beta once ci passes: https://beta.openmx.dev gets that commit's website, and its Linux and
#   Windows builds under /download/ (tools/beta-bundle.sh). B43 (opentennis's B745): the beta is no GitHub release
#   (Quiver Launcher took a rolling `beta` pre-release for the newest version and offered no real ones); this repo's
#   only releases are tools/release.sh's vX.Y.Z. The beta job leaves the bundle as a draft release of
#   FIZL0/openmx-beta (drafts are hidden) and asks that repo (one workflow, tools/beta-site.yml) to put it on its
#   Pages. Both need the secret BETA_DISPATCH_TOKEN (a fine-grained token with Contents read/write on
#   FIZL0/openmx-beta); without it the beta job fails and the beta isn't updated. No iPhone app: GitHub's macOS runners were often
#   not acquired, which fails the run (and mails) whatever continue-on-error says; a release's .ipa is built locally
#   by tools/release.sh (2026-11-03).
# - A published release (tools/release.sh) goes on https://openmx.dev, this repo's own Pages: its web.tar.gz as
#   built by the release script, deployed without building (~1 min).
name: pages
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
# a running beta always finishes; GitHub keeps only the newest queued one. Releases have their own group.
concurrency:
  group: pages-${{ github.event_name == 'release' && 'release' || 'beta' }}
  cancel-in-progress: false
jobs:
  ci:
    if: ${{ github.event_name != 'release' }}
    uses: ./.github/workflows/ci.yml
  web:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: rustup update --no-self-update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          # tools/web.sh builds in target/web, and builds wasm-bindgen-cli once into OPENMX_CROSS_DIR
          cache-directories: ~/openmx-cross
      # the online build id's commit, the same as the Linux job's
      - run: OPENMX_COMMIT=${GITHUB_SHA::7} OPENMX_CROSS_DIR=$HOME/openmx-cross tools/web.sh
      - run: tar -czf web.tar.gz -C web .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: web
          path: web.tar.gz
  linux:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    # Steam Runtime sniper (glibc 2.31) like tools/build.sh, so it runs on every SteamOS / Steam Deck
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      # tools/build.sh's linux build and packaging, without its docker step; the commit from Actions (the container's
      # checkout may have no usable git). GITHUB_SHA in the build's environment makes it a beta to the updater (P191,
      # crates/openmx/src/update.rs): its main menu asks which commit beta.openmx.dev's downloads are at
      - run: |
          export OPENMX_COMMIT=$(echo "$GITHUB_SHA" | cut -c1-7)
          # the player build's sim (P262: native), as tools/build.sh linux builds it
          cargo build --locked --release -p openmx --bin openmx $(bash tools/build.sh features)
          mkdir -p dist/linux
          strip -o dist/linux/openmx target/release/openmx
          sed -n '/^extras() {/,/^}/p' tools/build.sh > extras.sh
          bash -c '. ./extras.sh && extras dist/linux'
          tar -czf openmx-linux-x86_64.tar.gz -C dist/linux .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: linux
          path: openmx-linux-x86_64.tar.gz
  # P192: openmx.exe, cross-compiled with MinGW as tools/build.sh windows does (the icon from crates/openmx/build.rs's windres)
  windows:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - run: rustup update --no-self-update stable && rustup default stable && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - run: |
          tools/ci-apt.sh gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          export OPENMX_COMMIT=${GITHUB_SHA::7}
          tools/build.sh windows
          (cd dist/windows && zip -q ../../openmx-windows-x86_64.zip openmx.exe)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows
          path: openmx-windows-x86_64.zip
  beta:
    needs: [ci, web, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          sparse-checkout: tools/beta-bundle.sh
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DISPATCH: ${{ secrets.BETA_DISPATCH_TOKEN }}
          BETA: FIZL0/openmx-beta
        run: |
          [ -n "$DISPATCH" ] || { echo "::error::no BETA_DISPATCH_TOKEN secret: beta.openmx.dev can't be updated"; exit 1; }
          # a stale run still publishes, unless the beta site already shows a newer commit
          cur=$(curl -sSfL https://beta.openmx.dev/download/commit.txt 2>/dev/null | tr -cd 0-9a-f || true)
          if [ -n "$cur" ] && [ "$(gh api "repos/$GH_REPO/compare/$cur...$GITHUB_SHA" -q .status 2>/dev/null)" = behind ]; then
            echo "beta already at newer ${cur::7}, skipping"; exit 0
          fi
          # B50: an expired or revoked token answers 401 to everything; say so, not that deploy.yml is old
          err=$(GH_TOKEN=$DISPATCH gh api "repos/$BETA" -q .full_name 2>&1 >/dev/null) \
            || { echo "::error::BETA_DISPATCH_TOKEN can't read $BETA ($err): on HTTP 401 it expired or was revoked, make a new one (plan/HUMAN.md's beta dispatch token)"; exit 1; }
          # the beta repo's workflow must be tools/beta-site.yml's B43 one (it takes the bundle from a draft there);
          # an older one still reads this repo's `beta` release, so that stays until the workflow is updated
          GH_TOKEN=$DISPATCH gh api "repos/$BETA/contents/.github/workflows/deploy.yml" -q .content | base64 -d | grep -q beta-site.tar.gz \
            || { echo "::error::$BETA's deploy.yml is older than tools/beta-site.yml: copy it there"; exit 1; }
          bash src/tools/beta-bundle.sh web.tar.gz beta-site.tar.gz "$GITHUB_SHA" openmx-windows-x86_64.zip openmx-linux-x86_64.tar.gz
          # one draft at a time over there: an older run's (its deploy, if still waiting, fails and this one's follows)
          for id in $(GH_TOKEN=$DISPATCH gh api "repos/$BETA/releases" -q '.[] | select(.draft) | .id'); do
            GH_TOKEN=$DISPATCH gh api -X DELETE "repos/$BETA/releases/$id"
          done
          id=$(GH_TOKEN=$DISPATCH gh api "repos/$BETA/releases" -f tag_name=beta-site -f name="Beta site ${GITHUB_SHA::7}" -F draft=true -q .id)
          GH_TOKEN=$DISPATCH gh api -X POST "https://uploads.github.com/repos/$BETA/releases/$id/assets?name=beta-site.tar.gz" \
            -H 'Content-Type: application/gzip' --input beta-site.tar.gz -q .size
          GH_TOKEN=$DISPATCH gh api "repos/$BETA/dispatches" -f event_type=beta -F "client_payload[release]=$id"
          # the rolling release from before B43: gone for good (a no-op once it is)
          gh release view beta >/dev/null 2>&1 && gh release delete beta --cleanup-tag -y
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/beta" 2>/dev/null || true
  # openmx.dev: the published release's own website. Only a normal release (tools/release.sh VERSION without a
  # suffix): the beta and pre-releases (1.1.0-rc.1) never go on it. The github-pages environment allows main and v*
  # tags; beta.openmx.dev is FIZL0/openmx-beta's Pages, never this repo's.
  site:
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease && github.event.release.tag_name != 'beta' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir web && gh release download "${{ github.event.release.tag_name }}" -R "${{ github.repository }}" -p web.tar.gz -O - | tar xz -C web
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
